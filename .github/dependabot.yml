# Weekly proposals for dependency updates, each checked by CI before anyone
# merges it: for npm one pull request with the minor and patch updates, for
# Python one per package, covering both directories that pin it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A major upgrade (Tailwind 4, the next Next.js or React major) is its
      # own piece of work, not a weekly bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    # The suite's pins (requirements-dev.txt) and the function's
    # (api/requirements.txt) share packages that must carry the same version
    # (tests/test_repository.py), so one pull request moves a package in both.
    directories: ["/", "/api"]
    schedule:
      interval: weekly
    groups:
      python:
        group-by: dependency-name
    ignore:
      # numpy and scipy move only with a model release, together with the
      # golden pins (docs/adr/0014-versioning-and-golden-pins.md).
      - dependency-name: numpy
      - dependency-name: scipy
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
