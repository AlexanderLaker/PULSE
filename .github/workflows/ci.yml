# PRISM CI — the safety net the June 2026 review found missing (finding 2).
#
# Three jobs:
#   frontend    — typecheck + eslint + vitest (pure-function tests)
#   engine      — full pytest suite WITH scipy (exact numerics, golden pins)
#   engine-lite — engine tests WITHOUT scipy, exercising the numpy fallback
#                 path that runs on Vercel serverless (_scipy_compat.py).
#                 Golden pins auto-skip there; determinism + structural
#                 identities must still hold (review finding 7).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install numpy scipy fastapi pydantic pytest hypothesis httpx python-dotenv
      - run: python -m pytest tests/ -q

  engine-lite:
    # Mirrors the Vercel serverless runtime: api/requirements.txt has no
    # scipy (250 MB limit), so the engine runs on _scipy_compat fallbacks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install numpy fastapi pydantic pytest hypothesis httpx python-dotenv
      - run: >
          python -m pytest -q
          tests/test_bayesian_mc.py
          tests/test_cvar.py
          tests/test_tipping_points.py
          tests/test_properties.py
          tests/test_golden_pipeline.py
