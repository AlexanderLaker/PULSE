# PRISM CI — the safety net the June 2026 review found missing (finding 2).
#
# Two jobs:
#   frontend — typecheck + eslint + vitest (pure-function tests)
#   engine   — full pytest suite WITH scipy (exact numerics, golden pins)
#
# D13 (owner decision, 2026-06-10): the scipy-less "engine-lite" job was
# removed together with the _scipy_compat numpy-fallback layer. Exact
# scipy math is the only math; environments without scipy never compute
# (the deployed service is read-only over persisted runs, F2).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install numpy scipy fastapi pydantic pytest hypothesis httpx python-dotenv
      - run: python -m pytest tests/ -q
