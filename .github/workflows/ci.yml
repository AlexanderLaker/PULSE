# Continuous integration: the dashboard checks and the Python suite, and, when
# started by hand, the full production run against the reference run.
#
# The Python job installs requirements-dev.txt, the pinned environment the
# README tells developers to install, on the Python version in .python-version
# (the one Vercel uses), and runs the suite against a PostgreSQL service too, so
# the migration and the SQL are tested on both database backends. Both jobs
# audit the dependencies they install.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No high or critical advisory in what the dashboard ships.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The build prerenders pages inside ClerkProvider, which needs a
      # publishable key of the right form; this one names no real instance.
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          NEXT_TELEMETRY_DISABLED: "1"

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRISM_TEST_POSTGRES_URL: postgresql://prism:prism@localhost:5432/prism_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # No known vulnerability in the pinned Python dependencies, the function's included.
      - run: pip install pip-audit && pip-audit -r requirements-dev.txt -r api/requirements.txt
      - run: ruff check .
      - run: python -m pytest tests/ -q -n auto
      # The suite checks the generated files too; these steps name a stale one in the log.
      - run: python scripts/generate_seed.py --check
      - run: python scripts/build_cell_weights.py --check
      - run: python scripts/compute_overlap_correction.py --check
      - run: python scripts/build_driver_analysis.py --check

  # Started by hand (Actions, ci, Run workflow): the production run at its full
  # size, checked against the reference run of the PRISM Analysis record.
  full-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_reference_run.py -q
        env:
          PRISM_FULL_RUN: "1"
