# Python lint settings (ruff): syntax errors, unused code, likely bugs, the line
# length, imports below code, broad excepts, and noqa comments that no longer
# suppress anything.
target-version = "py310"
line-length = 120

[lint]
select = ["F", "E9", "E402", "E501", "B", "BLE", "W6", "RUF100"]
# FastAPI declares dependencies as Depends(...) defaults; zip() lengths are the tests' business.
ignore = ["B008", "B905"]

[lint.per-file-ignores]
# Generated modules: the driver texts, the PRISM Analysis readings and the
# parameter tables are written as single lines by their generators.
"prism/seed_drivers.py" = ["E501"]
"prism/analysis_texts.py" = ["E501"]
"prism/overlap_correction.py" = ["E501"]
"prism/cell_weight_estimate.py" = ["E501"]
